name: Monitor SICOP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-sicop
  cancel-in-progress: false

jobs:

  revisar-sicop:

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Revisar SICOP
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: node monitor.js

      - name: Guardar estado del monitor
        if: always()
        run: |
          git config user.name "Monitor SICOP"
          git config user.email "actions@github.com"

          if [ -f state.json ]; then
            git add state.json
          fi

          if [ -f health.json ]; then
            git add health.json
          fi

          if [ -f pending_change.json ]; then
            git add pending_change.json
          else
            git add -u pending_change.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar estado Monitor SICOP [skip ci]"
            git push
          fi
